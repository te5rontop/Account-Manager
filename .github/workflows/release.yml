name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release JAR
        run: ./gradlew clean build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          JAR_FILE="$(find build/libs -maxdepth 1 -type f -name 'account-manager-*.jar' ! -name '*-sources.jar' | head -n 1)"
          if [ -z "$JAR_FILE" ]; then
            echo "Release JAR not found."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$JAR_FILE" \
            --title "Account Manager $GITHUB_REF_NAME" \
            --generate-notes
